<!DOCTYPE html><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#fff}iframe{border:0;display:block}</style>
<body>
<script>
const q = new URLSearchParams(location.search);
const f = document.createElement("iframe");
f.style.width = q.get("w") + "px";
f.style.height = q.get("h") + "px";
f.src = q.get("u");
f.addEventListener("load", () => {
  const d = f.contentDocument;
  const s = d.createElement("style");
  // Congela los carruseles y las animaciones para que dos capturas del mismo
  // contenido sean identicas byte a byte.
  s.textContent = `
    *,*::before,*::after{transition:none!important;animation:none!important}
    .carousel-track img{opacity:0!important}
    .carousel-track img:first-child{opacity:1!important}
    html{scroll-behavior:auto!important}
  `;
  d.head.appendChild(s);
});
document.body.appendChild(f);
</script>
