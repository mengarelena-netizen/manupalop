<!DOCTYPE html><meta charset="utf-8"><body><pre id="out">x</pre>
<script>
const q=new URLSearchParams(location.search);
const f=document.createElement("iframe");
f.style.cssText="width:1280px;height:900px;border:0";
f.src=q.get("u");
f.addEventListener("load",()=>{setTimeout(()=>{
  const d=f.contentDocument,w=f.contentWindow;
  const c=d.querySelector(".container");
  const cs=w.getComputedStyle(c);
  const root=w.getComputedStyle(d.documentElement);
  document.getElementById("out").textContent="PROBE "+JSON.stringify({
    maxWidth:cs.maxWidth, width:cs.width, padding:cs.padding, margin:cs.margin,
    varContainer:root.getPropertyValue("--container"),
    varAccent:root.getPropertyValue("--accent"),
    varRadius:root.getPropertyValue("--radius"),
    bodyFont:w.getComputedStyle(d.body).fontFamily
  })+" ENDPROBE";
},900)});
document.body.appendChild(f);
</script>
